<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" font-family="Helvetica, Arial, sans-serif">
  <title>Grasshopper canvas: Fold Theory live listener wired to LiveDesign (diagram, not a screenshot)</title>
  <rect width="1100" height="560" fill="#d9d8d3"/>
  <g stroke="#c9c8c3" stroke-width="1">
    <path d="M0 140H1100M0 280H1100M0 420H1100M220 0V560M440 0V560M660 0V560M880 0V560"/>
  </g>
  <text x="20" y="32" font-size="18" font-weight="bold" fill="#333">Grasshopper canvas (diagram, not a screenshot)</text>

  <!-- wires -->
  <g fill="none" stroke="#555" stroke-width="3">
    <path d="M188 130 C 260 130, 280 175, 352 175"/>
    <path d="M150 230 C 250 230, 270 215, 352 215"/>
    <path d="M150 320 C 260 320, 270 255, 352 255"/>
    <path d="M568 185 C 650 185, 660 170, 742 170"/>
    <path d="M568 245 C 640 245, 620 420, 700 420"/>
  </g>

  <!-- Boolean toggle -->
  <rect x="40" y="110" width="148" height="40" rx="6" fill="#e9e9e9" stroke="#444" stroke-width="2"/>
  <text x="58" y="136" font-size="16">Boolean Toggle</text>
  <rect x="40" y="152" width="80" height="22" rx="4" fill="#fff" stroke="#444"/>
  <text x="52" y="169" font-size="14" font-weight="bold" fill="#1a7f37">True</text>
  <circle cx="188" cy="130" r="6" fill="#fff" stroke="#444" stroke-width="2"/>

  <!-- number 500 -->
  <rect x="60" y="215" width="90" height="30" rx="6" fill="#e9e9e9" stroke="#444" stroke-width="2"/>
  <text x="88" y="236" font-size="16">500</text>
  <circle cx="150" cy="230" r="6" fill="#fff" stroke="#444" stroke-width="2"/>

  <!-- number 5001 -->
  <rect x="60" y="305" width="90" height="30" rx="6" fill="#e9e9e9" stroke="#444" stroke-width="2"/>
  <text x="83" y="326" font-size="16">5001</text>
  <circle cx="150" cy="320" r="6" fill="#fff" stroke="#444" stroke-width="2"/>

  <!-- listener -->
  <rect x="352" y="150" width="216" height="130" rx="8" fill="#a9d97a" stroke="#2f5a14" stroke-width="2"/>
  <text x="460" y="140" font-size="14" text-anchor="middle" fill="#333">Python 3 Script (listener)</text>
  <text x="366" y="181" font-size="17">On</text>
  <text x="366" y="221" font-size="17">Interval</text>
  <text x="366" y="261" font-size="17">Port</text>
  <text x="554" y="191" font-size="17" text-anchor="end">Version</text>
  <text x="554" y="251" font-size="17" text-anchor="end">Status</text>
  <g fill="#fff" stroke="#2f5a14" stroke-width="2">
    <circle cx="352" cy="175" r="6"/><circle cx="352" cy="215" r="6"/><circle cx="352" cy="255" r="6"/>
    <circle cx="568" cy="185" r="6"/><circle cx="568" cy="245" r="6"/>
  </g>

  <!-- panel -->
  <rect x="700" y="380" width="360" height="80" fill="#fff59a" stroke="#555" stroke-width="2"/>
  <text x="714" y="410" font-family="Menlo, monospace" font-size="14">Live: Fold Theory design</text>
  <text x="714" y="432" font-family="Menlo, monospace" font-size="14">version 12 (checking every 500 ms).</text>
  <circle cx="700" cy="420" r="6" fill="#fff" stroke="#555" stroke-width="2"/>
  <text x="880" y="480" font-size="14" text-anchor="middle" fill="#333">Panel</text>

  <!-- LiveDesign -->
  <rect x="742" y="70" width="170" height="290" rx="8" fill="#f0a54a" stroke="#7a4a0c" stroke-width="2"/>
  <text x="827" y="60" font-size="14" text-anchor="middle" fill="#333">Hops: http://127.0.0.1:5001/live_design</text>
  <text x="756" y="176" font-size="17">V</text>
  <g font-size="16" text-anchor="end">
    <text x="898" y="100">V</text><text x="898" y="130">M</text><text x="898" y="160">R3</text>
    <text x="898" y="190">Cut</text><text x="898" y="220">Sc</text><text x="898" y="250">Sh</text>
    <text x="898" y="280">L</text><text x="898" y="310">P</text><text x="898" y="340">S</text>
  </g>
  <g fill="#fff" stroke="#7a4a0c" stroke-width="2">
    <circle cx="742" cy="170" r="6"/>
    <circle cx="912" cy="95" r="5"/><circle cx="912" cy="125" r="5"/><circle cx="912" cy="155" r="5"/>
    <circle cx="912" cy="185" r="5"/><circle cx="912" cy="215" r="5"/><circle cx="912" cy="245" r="5"/>
    <circle cx="912" cy="275" r="5"/><circle cx="912" cy="305" r="5"/><circle cx="912" cy="335" r="5"/>
  </g>
  <g font-size="13" fill="#333">
    <text x="924" y="129">model mesh</text><text x="924" y="159">ribs in place</text>
    <text x="924" y="189">cut outlines</text><text x="924" y="249">sheet outlines</text>
    <text x="924" y="339">summary text</text>
  </g>

  <!-- step numbers -->
  <g font-size="13" font-weight="bold" fill="#fff">
    <circle cx="40" cy="98" r="13" fill="#c0392b"/><text x="40" y="103" text-anchor="middle">5</text>
    <circle cx="60" cy="203" r="13" fill="#c0392b"/><text x="60" y="208" text-anchor="middle">6</text>
    <circle cx="60" cy="293" r="13" fill="#c0392b"/><text x="60" y="298" text-anchor="middle">7</text>
    <circle cx="700" cy="368" r="13" fill="#c0392b"/><text x="700" y="373" text-anchor="middle">8</text>
    <circle cx="722" cy="90" r="13" fill="#c0392b"/><text x="722" y="95" text-anchor="middle">10</text>
    <circle cx="655" cy="160" r="13" fill="#c0392b"/><text x="655" y="165" text-anchor="middle">11</text>
  </g>
  <text x="20" y="540" font-size="14" fill="#333">Red numbers match the steps in docs/RHINO_LIVE_SYNC.md. Wires go from an output (right side) to an input (left side).</text>
</svg>
